# Fly.io config — https://fly.io/docs/reference/configuration/
app = "virtual-navigator"
primary_region = "ewr"

[env]
  VN_DB = "/data/vn.sqlite"
  VN_ENABLE_TICKER = "1"

[mounts]
  source = "vn_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # the ticker must keep running so races advance and trackers are polled;
  # never scale to zero
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # /healthz answers 503 when the ticker has stopped ticking, so a wedged
  # engine gets the machine restarted instead of boats silently parking
  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
